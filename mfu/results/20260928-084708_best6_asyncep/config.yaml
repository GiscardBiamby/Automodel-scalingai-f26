# Best configuration found (config "E" in mfu/REPORT.md): 10.5x the baseline's tokens/s/GPU at the same loss curve.
#
# = baseline + THD packing into 4096-token rows (fixed shapes, 97% fill) + FusedLinearCrossEntropy
#   + 2 packs/GPU (no gradient accumulation) + manual Python GC.
# Equivalent to the pack4096 config with these CLI overrides (how it was measured):
#   --loss_fn._target_=nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy --model.output_hidden_states=true
#   --step_scheduler.local_batch_size=2 --step_scheduler.gc_every_steps=50

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 16   # packs of 4096 tokens (~20 SQuAD samples each at 97% fill) -> ~63k real tokens/step
  local_batch_size: 2     # 2 packs/GPU -> no gradient accumulation (fits thanks to FusedLinearCrossEntropy)
  gc_every_steps: 50      # disable automatic Python GC (gen-2 pauses ~1 s); manual gen-1 collect every 50 steps
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 40

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  trust_remote_code: true
  output_hidden_states: true   # required by FusedLinearCrossEntropy

checkpoint:
  enabled: false
  checkpoint_dir: mfu/runs/_unnamed  # also where training.jsonl is written; run.sh overrides it per run

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  ep_size: 8
  sequence_parallel: false
  defer_fsdp_grad_sync: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy  # no [tokens x 131k] fp32 logits

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train

packed_sequence:
  packed_sequence_size: 4096
  packing_strategy: thd

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: True

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 64

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

mfu:
  peak_tflops: 989  # H100 SXM dense BF16

nvtx: false

wandb:
  enable: true
  entity: scalingai-f26
  project: nemotron-nano-v3-mfu
  mode: online
