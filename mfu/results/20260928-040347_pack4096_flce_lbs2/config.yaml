# Intervention B: THD sequence packing into fixed 4096-token rows (as in examples/.../nemotron_ultra_v3_squad.yaml).
#
# vs baseline: packed_sequence_size 0 -> 4096 (thd), packed THD collator (train + validation), and the batch
# re-expressed in packs (local 1 pack/GPU, global 16 packs ~= 63k real tokens/step vs ~53k in the baseline;
# compare tokens/s, not step time). Removes the ~35% padding of pad-to-longest batching
# (mfu/results/squad_lengths.json), gives every micro-batch the same shape, and makes each micro-batch ~1.6x
# larger per GPU (4096 vs ~2.5k positions).

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 16   # packs of 4096 tokens (~20 SQuAD samples each at 97% fill) -> ~63k real tokens/step
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 40

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  trust_remote_code: true

checkpoint:
  enabled: false
  checkpoint_dir: mfu/runs/_unnamed  # also where training.jsonl is written; run.sh overrides it per run

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  ep_size: 8
  sequence_parallel: false
  defer_fsdp_grad_sync: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train

packed_sequence:
  packed_sequence_size: 4096
  packing_strategy: thd

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: True

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 64

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

mfu:
  peak_tflops: 989  # H100 SXM dense BF16

nvtx: false

wandb:
  enable: true
  entity: scalingai-f26
  project: nemotron-nano-v3-mfu
  mode: online
